name: test-windows-wheel

# Standalone loop for iterating on the Windows wheel build without cutting a
# release. Once this passes, port the build-windows job into publish.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MinGW-w64 UCRT Fortran toolchain (MSYS2)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-gcc-fortran

      - name: Put UCRT64 toolchain on PATH
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" >> "$GITHUB_PATH"

      - name: Install build tooling
        shell: bash
        run: python -m pip install --upgrade pip "meson-python>=0.15.0" "numpy>=2.0" meson ninja build delvewheel

      # force meson onto the MinGW toolchain, not MSVC, so the C glue and Fortran share an ABI
      - name: Build Windows wheel
        shell: bash
        env:
          CC: gcc
          CXX: g++
          FC: gfortran
        run: |
          rm -rf dist
          python -m build --wheel --no-isolation

      - name: Repair wheel (vendor MinGW runtime DLLs)
        shell: bash
        run: |
          delvewheel show dist/*.whl
          delvewheel repair dist/*.whl -w wheelhouse --add-path "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin"
          rm dist/*.whl
          mv wheelhouse/*.whl dist/

      - name: Verify repaired wheel in a clean venv
        shell: bash
        run: |
          python -m venv verify_env
          verify_env/Scripts/python.exe -m pip install --upgrade pip
          verify_env/Scripts/python.exe -m pip install dist/*.whl
          verify_env/Scripts/python.exe -c "import xleaf; print(xleaf.__version__); print('OK', xleaf.simulate_leaf().shape)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-test
          path: dist/*
