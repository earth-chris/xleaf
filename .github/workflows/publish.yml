name: build-deploy

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-13]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1

      - run: rm -rf dist && pixi run -e build build

      - name: Repair wheel (Linux)
        if: runner.os == 'Linux'
        run: |
          pixi run -e build python -m auditwheel repair dist/*linux_x86_64.whl --wheel-dir /tmp/wheelhouse
          rm dist/*linux_x86_64.whl
          mv /tmp/wheelhouse/*manylinux*.whl dist/

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
