name: pytest

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.8.1

    - name: Type check
      run: pixi run typecheck

    - name: Run pytest
      run: pixi run test

    - name: Upload coverage report
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: coverage.xml
